# The integration suites (tests/integration) share one process and one
# database; they clean the tables they assert about and a few mutate
# process env vars, so tests must never run concurrently.
[env]
RUST_TEST_THREADS = "1"
# ts-rs writes the TypeScript bindings here on `cargo test` (a bare
# `cargo test export_bindings` only regenerates them), so the frontend's
# types come from the Rust wire types instead of a hand-written mirror.
TS_RS_EXPORT_DIR = { value = "frontend/src/lib/api/types", relative = true }
