# Builds the api and frontend images for the box's CPU, publishes them to
# GHCR tagged with the commit sha (and `latest`), then copies the compose
# files to the box, logs it into GHCR with this run's token (nothing
# long-lived stays on the box, and the repository is never cloned there)
# and runs deploy/deploy.sh over ssh. Runs after CI passes on main; run
# it by hand with an older sha to roll back.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key whose
# public half is in the box's authorized_keys) and DEPLOY_KNOWN_HOSTS
# (the box's `ssh-keyscan` line, so the host key is pinned). Until
# DEPLOY_HOST exists the workflow resolves the commit and stops, so a
# fresh repository never shows a failed deploy.
#
# IMAGE_NAMESPACE (ghcr.io/<owner>/<repo>, the repository by default),
# DEPLOY_DIR (where the stack lives on the box) and PLATFORMS (the box's
# CPU) are the knobs below; docker-compose.prod.yml reads the same image
# names through .env.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (default the current head of main)
        required: false

# One deploy at a time, and a running one finishes before the next starts.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /opt/${{ github.event.repository.name }}
  PLATFORMS: linux/amd64

jobs:
  resolve:
    name: Resolve commit
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      configured: ${{ steps.pick.outputs.configured }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - id: pick
        run: |
          echo "sha=${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          if [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST is not set; nothing to deploy to." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: resolve
    if: needs.resolve.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.resolve.outputs.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to production
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Configure ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Ship the stack files
        run: |
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/deploy_key "$target" "mkdir -p ${{ env.DEPLOY_DIR }}"
          scp -q -i ~/.ssh/deploy_key -r docker-compose.yml docker-compose.prod.yml deploy "$target:${{ env.DEPLOY_DIR }}/"
      - name: Roll the stack
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -eu; docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null; cd ${{ env.DEPLOY_DIR }}; IMAGE_NAMESPACE='${{ env.IMAGE_NAMESPACE }}' deploy/deploy.sh ${{ needs.resolve.outputs.sha }}; rc=\$?; docker logout ghcr.io > /dev/null; exit \$rc"
