name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs so they land once CI is green.
# Requires "Allow auto-merge" on the repo and branch protection on main
# with the CI checks required. Major bumps are left for manual review,
# and so is a minor bump of a 0.x package: for those crates the minor
# is the breaking version (argon2 0.5 to 0.6 changed its whole API).
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge (patch, or minor above 0.x)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           !startsWith(steps.meta.outputs.previous-version, '0.'))
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
