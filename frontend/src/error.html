<!doctype html>
<!-- The SvelteKit fallback for when the app itself cannot render (the
     root layout failing or the server crashing before hydration): a
     static page in the theme's dark palette, since no CSS bundle is
     guaranteed to load here. -->
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status%</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #fafafa;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 2.5rem;
        border: 1px solid #262626;
        background: rgba(23, 23, 23, 0.55);
      }
      .status {
        font-family: ui-monospace, monospace;
        font-size: 3.75rem;
        line-height: 1;
        font-weight: 600;
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0.5rem 0 0;
      }
      p {
        color: #a3a3a3;
        margin: 1.25rem 0 0;
      }
      a {
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">%sveltekit.status%</p>
      <h1>%sveltekit.error.message%</h1>
      <p>The page could not be rendered. <a href="/">Back to the start</a></p>
    </main>
  </body>
</html>
